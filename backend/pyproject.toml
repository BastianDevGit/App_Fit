[project]
name = "personal-trainer-ia-backend"
version = "0.1.0"
description = "Backend del MVP de Personal Trainer IA: motor de progresión determinista, bloques con LLM validado y dieta."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["catalog/data/*.json", "nutrition/data/*.json", "static/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E501", "B905"]
